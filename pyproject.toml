[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-detect"
version = "0.1.0"
description = "D435/D405 dual-camera detect & suction perception toolkit"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "PyYAML",
  "Pillow",
  "fastapi",
  "uvicorn",
  "pydantic",
  "PyQt-Fluent-Widgets>=1.5.0",
  "pyrealsense2",
]

[project.optional-dependencies]
# Prefer CPU wheels on machines without NVIDIA driver:
#   pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
#   pip install -e ".[yolo]"
# On AutoDL GPU hosts, install CUDA torch from pytorch.org first, then this extra.
yolo = [
  "ultralytics>=8.3.0",
]

[project.scripts]
rs-detect-desktop = "rs_detect.desktop.app:main"
rs-detect-web = "rs_detect.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
