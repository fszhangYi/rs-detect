[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-detect"
version = "0.1.0"
description = "D435/D405 dual-camera detect & suction perception toolkit"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "PyYAML",
  "Pillow",
  "fastapi",
  "uvicorn",
  "pydantic",
  "PyQt-Fluent-Widgets>=1.5.0",
  "pyrealsense2",
]

[project.scripts]
rs-detect-desktop = "rs_detect.desktop.app:main"
rs-detect-web = "rs_detect.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
