[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-detect"
version = "0.1.0"
description = "D435 scene + D405 wrist dual-camera perception & suction grasp toolkit (scan, calib, YOLO, Cell C arm, grasp loop)"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "scipy",
  "opencv-python-headless",
  "PyYAML",
  "Pillow",
  "fastapi",
  "uvicorn",
  "pydantic",
  "python-multipart",
]

[project.optional-dependencies]
# RealSense SDK wheel (Linux / Win with Intel RS installed). Without it → Mock cams.
realsense = [
  "pyrealsense2",
]
# Fluent desktop UI (PyQt5). Web UI does not need this.
desktop = [
  "PyQt-Fluent-Widgets>=1.5.0",
]
# Prefer CPU wheels on machines without NVIDIA driver:
#   pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
#   pip install -e ".[yolo]"
# On AutoDL GPU hosts, install CUDA torch from pytorch.org first, then this extra.
yolo = [
  "ultralytics>=8.3.0",
]
# Convenience: everything except CUDA torch
all = [
  "rs-detect[realsense,desktop,yolo]",
]

[project.scripts]
rs-detect-desktop = "rs_detect.desktop.app:main"
rs-detect-web = "rs_detect.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
